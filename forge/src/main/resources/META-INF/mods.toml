modLoader = "javafml"
loaderVersion = "*"
license = "CC0-1.0"
clientSideOnly = true

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "Sxilverr"
description = "Automatically place a light source from your inventory around you."
logoFile = "assets/${id}/icon.png"
logoBlur = false
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "forge"
mandatory = true
versionRange = "*"
ordering = "NONE"
side = "CLIENT"
